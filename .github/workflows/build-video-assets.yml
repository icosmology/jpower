name: Finalize astronomy video delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-video-assets.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q requests pillow
      - name: Fetch original 4K excerpts
        run: |
          mkdir -p final/Native_4K
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          from PIL import Image
          root=Path('final/Native_4K')
          source='https://storage.noirlab.edu/media/archives/videos/ultra_hd/02112025-DESI-b-roll-telescope-movement.mp4'
          rows=[]
          for i,ss in enumerate([30,260],1):
              p=root/f'DESI_Mayall_native4K_{i:02}.mp4'
              try:
                  subprocess.run(['ffmpeg','-v','error','-y','-rw_timeout','45000000','-ss',str(ss),'-i',source,'-t','12','-an','-c:v','copy','-avoid_negative_ts','make_zero','-movflags','+faststart',str(p)],check=True,timeout=240)
                  q=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]));s=next(s for s in q['streams'] if s['codec_type']=='video')
                  if s['width']<3840 or s['height']<2160:raise ValueError('source is not native UHD')
                  rows.append({'file':p.name,'source':source,'source_page':'https://noirlab.edu/public/videos/02112025-DESI-b-roll-telescope-movement/','source_in_requested':ss,'requested_seconds':12,'probe':q})
                  frame=root/f'DESI_Mayall_native4K_{i:02}.tif'
                  subprocess.run(['ffmpeg','-v','error','-y','-ss','2','-i',str(p),'-frames:v','1','-c:v','tiff','-compression_algo','raw',str(frame)],check=True)
                  print('NATIVE4K',p.name,p.stat().st_size,s['width'],s['height'],flush=True)
              except Exception as e:
                  p.unlink(missing_ok=True);print('UHD FAILED',i,str(e),flush=True)
          (root/'sources_4K.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'README.txt').write_text('DESI梅奥尔望远镜原生4K实拍片段。直接截取NOIRLab官方4K媒体流，未放大、未AI生成；时间切点受原片关键帧影响，实际时长见sources_4K.json。TIFF为同像素原生视频关键帧。\n来源与署名：DESI Collaboration/DOE/KPNO/NOIRLab/NSF/AURA/M. Sargent (Berkeley Lab)\nhttps://noirlab.edu/public/videos/02112025-DESI-b-roll-telescope-movement/\n使用条件：https://noirlab.edu/public/copyright/\n',encoding='utf-8')
          PY
      - name: Wait for rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import requests,os,time
          url='https://api.github.com/repos/icosmology/jpower/actions/runs/34013974871'
          for i in range(90):
              r=requests.get(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']},timeout=30);r.raise_for_status();j=r.json()
              if j['status']=='completed':
                  if j['conclusion']!='success':raise RuntimeError('render failed: '+str(j['conclusion']))
                  break
              time.sleep(10)
          else:raise TimeoutError('render did not finish')
          PY
      - name: Retrieve rendered packages
        uses: actions/download-artifact@v4
        with:
          run-id: 34013974871
          github-token: ${{ github.token }}
          path: render_artifacts
      - name: Retrieve original public satellite media
        uses: actions/download-artifact@v4
        with:
          name: public-telescope-satellite-media
          run-id: 34012742951
          github-token: ${{ github.token }}
          path: original
      - name: Flatten and inspect deliverables
        run: |
          python - <<'PY'
          import zipfile,json,shutil,subprocess
          from pathlib import Path
          r=Path('render_artifacts');f=Path('final')
          mapping={'Film_1080p.zip':'Film_1080p','Film_6to1.zip':'Film_6to1','Selected_Real_Video_Clips.zip':'Video_Clips','Source_Photographs.zip':'Photographs'}
          for archive in r.rglob('*.zip'):
              if archive.name not in mapping:continue
              dest=f/mapping[archive.name];dest.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as z:z.extractall(dest)
          src=Path('original');out=f/'DAMPE_Originals';out.mkdir(exist_ok=True)
          for name in ['pmo100.mp4','wukong_launch.mp4','wukong_interview.mp4','csst0.mp4','manifest.json']:
              shutil.copy2(src/name,out/name)
          (out/'README.txt').write_text('悟空号、发射、科研访谈及CSST公开原片。文件保持下载时原始编码及像素，不进行伪高清放大。pmo100.mp4是紫金山天文台在轨十周年专题的公开网络版，960×544；wukong_launch.mp4是2015年发射历史影像，800×450；wukong_interview.mp4是科研访谈，1280×720；csst0.mp4是CSST公开演示，1280×720。\n这些公开版本不满足院里原生1080p最低要求，作为选镜与联系调片参考；正式广播版请向来源单位确认高清母版和授权。来源链接及原生参数见manifest.json。',encoding='utf-8')
          # Add the full official credit supplied for the Mayall footage.
          credit='DESI Mayall telescope footage credit: DESI Collaboration/DOE/KPNO/NOIRLab/NSF/AURA/M. Sargent (Berkeley Lab)\nSource: https://noirlab.edu/public/videos/02112025-DESI-b-roll-telescope-movement/\nTerms: https://noirlab.edu/public/copyright/\nOther media: exact source pages in sources.json; retain their individual credits and confirm public-broadcast permission.\n'
          for folder in ['Film_1080p','Film_6to1','Video_Clips','Photographs']:(f/folder/'CREDITS.txt').write_text(credit,encoding='utf-8')
          for folder in sorted(f.iterdir()):
              if not folder.is_dir():continue
              total=sum(p.stat().st_size for p in folder.rglob('*') if p.is_file()); print('PACKAGE_CONTENT',folder.name,total,flush=True)
              for p in folder.glob('*.mp4'):
                  j=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_name,width,height','-of','json',str(p)]));print('MP4',p.name,json.dumps(j),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-Film-1080p
          path: final/Film_1080p/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-Film-6to1
          path: final/Film_6to1/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-Video-Clips
          path: final/Video_Clips/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-Photographs
          path: final/Photographs/
          retention-days: 7
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-DAMPE-Originals
          path: final/DAMPE_Originals/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-Native-4K-DESI
          path: final/Native_4K/
          retention-days: 7
          compression-level: 3
