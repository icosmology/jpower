name: Package downloaded public footage
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-video-assets.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-telescope-satellite-media
          run-id: 34012742951
          github-token: ${{ github.token }}
          path: assets
      - name: Split transport archives
        run: |
          mkdir -p metadata chunks
          find assets -maxdepth 1 -type f ! -name '*.mp4' -exec cp {} metadata/ \;
          cat assets/manifest.json
          tar -cf - -C assets . | split -b 400M -d -a 2 - chunks/media.tar.part
          ls -lh chunks metadata
      - uses: actions/upload-artifact@v4
        with:
          name: public-media-metadata
          path: metadata/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: public-media-part00
          path: chunks/media.tar.part00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: public-media-part01
          path: chunks/media.tar.part01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: public-media-part02
          path: chunks/media.tar.part02
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: public-media-part03
          path: chunks/media.tar.part03
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
